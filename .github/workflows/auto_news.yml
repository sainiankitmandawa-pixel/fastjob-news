name: FastJob Auto News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install feedparser supabase requests beautifulsoup4

      - name: Run Auto News Script (15 Posts Per Category)
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -u bot.py

      - name: Commit and Push Updated Sitemap
        run: |
          git config --global user.name "FastJob Bot"
          git config --global user.email "bot@fastjob.online"
          git add sitemap.xml
          git diff --staged --quiet || (git commit -m "Auto-update clean sitemap.xml" && git pull --rebase origin main && git push origin main)
