name: Run Auto News Script (4 AM Daily)

on:
  schedule:
    - cron: '30 22 * * *' # Roz subah 4:00 AM IST (22:30 UTC) par automatically run hoga
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m empower --upgrade pip || true
          pip install feedparser beautifulsoup4 requests

      - name: Run bot script
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python bot.py
