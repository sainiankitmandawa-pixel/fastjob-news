name: FastJob Auto News Bot

on:
  schedule:
    # Bot har ghante trigger hoga, aur script andar 10-10 min ruk kar 6 posts karegi
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install feedparser supabase requests beautifulsoup4
      - name: Run Auto News Script
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python bot.py
