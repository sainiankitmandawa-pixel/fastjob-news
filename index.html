<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">FastJob Alert - Live Global & Verified Coverage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mukta', sans-serif; }
        #detail-content { color: #333; line-height: 1.8; font-size: 1.125rem; }
        #detail-content p { margin-bottom: 1.5rem; }
        #detail-content .intro-text { font-weight: 600; font-size: 1.2rem; }
        #detail-content .article-subheading { font-size: 1.5rem; font-weight: 800; color: #111; margin-top: 2rem; margin-bottom: 1rem; }
        .article-table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 1rem; }
        .article-table th, .article-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .article-table th { background-color: #f5f5f5; font-weight: 700; color: #333; }
        .nav-scroll::-webkit-scrollbar { display: none; }
        
        /* Slider Styles */
        .slider-container { position: relative; overflow: hidden; border-radius: 0.5rem; }
        .slide { display: none; animation: fade 0.5s ease-in-out; }
        .slide.active { display: block; }
        @keyframes fade { from { opacity: 0.8; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

    <!-- Top Bar & Header (Same as before) -->
    <header class="bg-[#cc0000] text-white sticky top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 flex items-center justify-between py-2 gap-4">
            <a href="index.html" class="flex items-center bg-white px-2 py-1 rounded shrink-0 cursor-pointer">
                <i class="fa-solid fa-bolt text-yellow-500 text-xl md:text-2xl mr-1"></i>
                <span class="text-lg md:text-xl font-black text-[#cc0000] tracking-tighter">FASTJOB</span>
                <span class="text-[10px] md:text-xs font-bold text-gray-800 ml-1 mt-1">ALERT</span>
            </a>
            <div class="bg-white rounded px-3 py-1.5 flex items-center w-full max-w-2xl shadow-inner flex-grow hidden md:flex">
                <input type="text" id="searchInput" onkeyup="searchNews()" placeholder="Search latest news..." class="w-full text-sm text-black outline-none font-semibold">
                <i class="fa-solid fa-magnifying-glass text-[#cc0000] cursor-pointer"></i>
            </div>
            <button onclick="toggleMobileMenu()" class="text-white text-2xl hover:text-yellow-300 transition focus:outline-none shrink-0 pl-2">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end">
        <div class="w-64 bg-white h-full shadow-2xl flex flex-col p-4">
            <button onclick="toggleMobileMenu()" class="self-end text-gray-500 hover:text-red-600 text-2xl mb-4"><i class="fa-solid fa-xmark"></i></button>
            <input type="text" id="mobileSearchInput" onkeyup="searchNewsMobile()" placeholder="Search..." class="w-full bg-gray-100 p-2 mb-4 rounded outline-none border">
            <nav class="flex flex-col space-y-4 font-bold text-gray-800">
                <button onclick="filterCategoryAndClose('All')" class="text-left border-b pb-2">HOME</button>
                <button onclick="filterCategoryAndClose('Politics')" class="text-left border-b pb-2">POLITICS</button>
                <button onclick="filterCategoryAndClose('Economy')" class="text-left border-b pb-2">ECONOMY</button>
                <button onclick="filterCategoryAndClose('Business')" class="text-left border-b pb-2">BUSINESS</button>
                <button onclick="filterCategoryAndClose('Sports')" class="text-left border-b pb-2">SPORTS</button>
                <button onclick="filterCategoryAndClose('Automobile')" class="text-left border-b pb-2">AUTO</button>
                <button onclick="filterCategoryAndClose('Tech & AI')" class="text-left border-b pb-2">TECH & AI</button>
                <button onclick="filterCategoryAndClose('Jobs')" class="text-left text-[#cc0000] border-b pb-2">JOBS</button>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 flex-grow w-full overflow-hidden">
        
        <!-- Detailed Article View -->
        <div id="article-view" class="hidden bg-white p-4 md:p-8 max-w-4xl mx-auto shadow-sm border-t-4 border-[#cc0000]">
            <button onclick="goBackHome()" class="mb-4 bg-gray-100 font-bold py-2 px-4 rounded inline-flex items-center text-sm"><i class="fa-solid fa-arrow-left mr-2"></i> Back to News</button>
            <h1 id="detail-title" class="text-2xl md:text-[40px] font-black text-gray-900 leading-tight mb-4"></h1>
            <div class="flex items-center gap-3 border-b pb-4 mb-4">
                <img src="https://ui-avatars.com/api/?name=News+Desk&background=cc0000&color=fff" class="w-10 h-10 rounded-full shadow">
                <div>
                    <p class="font-bold text-sm">FastJob Alert Desk</p>
                    <p id="detail-date" class="text-xs text-gray-500"></p>
                </div>
            </div>
            <img id="detail-image" src="" class="w-full h-auto object-cover max-h-[400px] mb-6 rounded">
            <div id="detail-content" class="w-full overflow-x-auto"></div>
        </div>

        <!-- Home Grid View -->
        <div id="home-view">
            <!-- Top 5 Auto Slider -->
            <div id="slider-wrapper" class="slider-container bg-white border shadow-sm min-h-[300px] md:min-h-[450px] mb-8">
                <p class="p-10 text-center text-gray-500 font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading Latest Updates...</p>
            </div>

            <!-- Category Wise Sections -->
            <div id="category-sections" class="space-y-10"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://wioheljpjdcprozqumpv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_d_ROr-nG6RpIRlVWtIE-Fg_sciaLZXR";
        let allNews = [];
        let slideIndex = 0;
        let slideInterval;

        async function loadNews() {
            try {
                // Fetch more posts to fill categories
                const response = await fetch(SUPABASE_URL + "/rest/v1/posts?select=*&order=id.desc&limit=100", {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
                });
                const data = await response.json();
                if (data && data.length > 0) {
                    allNews = data;
                    renderHome(allNews);
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('slug')) openArticle(urlParams.get('slug'));
                }
            } catch (err) { console.error(err); }
        }

        function renderHome(newsList) {
            document.getElementById('article-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            
            // 1. Render Slider (Top 5)
            const top5 = newsList.slice(0, 5);
            let sliderHTML = '';
            top5.forEach((item, index) => {
                sliderHTML += `
                <div class="slide ${index === 0 ? 'active' : ''} cursor-pointer w-full h-[300px] md:h-[450px] relative group" onclick="openArticle('${item.slug}')">
                    <img src="${item.image_url}" class="w-full h-full object-cover">
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/80 to-transparent p-4 md:p-8 pt-20">
                        <span class="bg-[#cc0000] text-white text-[10px] md:text-xs px-2 py-1 rounded font-bold uppercase">${item.category}</span>
                        <h2 class="text-white text-xl md:text-4xl font-black mt-2 leading-tight">${item.title}</h2>
                    </div>
                </div>`;
            });
            document.getElementById('slider-wrapper').innerHTML = sliderHTML;
            clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                const slides = document.querySelectorAll('.slide');
                if(!slides.length) return;
                slides[slideIndex].classList.remove('active');
                slideIndex = (slideIndex + 1) % slides.length;
                slides[slideIndex].classList.add('active');
            }, 3000);

            // 2. Render Category Sections
            const cats = ['Politics', 'Economy', 'Business', 'Sports', 'Automobile', 'Tech & AI', 'Jobs'];
            let sectionsHTML = '';
            
            cats.forEach(cat => {
                const catPosts = newsList.filter(p => p.category === cat);
                if(catPosts.length > 0) {
                    sectionsHTML += `
                    <div>
                        <div class="flex justify-between items-center mb-4 border-b-2 border-gray-200 pb-2">
                            <h3 class="text-xl md:text-2xl font-black text-gray-900 border-l-4 border-[#cc0000] pl-3 uppercase">${cat}</h3>
                            <button onclick="filterCategory('${cat}')" class="text-sm font-bold text-[#cc0000] hover:underline">View More &raquo;</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${catPosts.slice(0, 4).map(item => `
                                <div onclick="openArticle('${item.slug}')" class="bg-white border shadow-sm cursor-pointer rounded-lg overflow-hidden flex flex-col">
                                    <img src="${item.image_url}" class="w-full h-40 object-cover">
                                    <div class="p-3 flex-grow">
                                        <h4 class="font-bold text-sm md:text-base text-gray-900 line-clamp-3">${item.title}</h4>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                }
            });
            document.getElementById('category-sections').innerHTML = sectionsHTML;
        }

        function openArticle(slug) {
            const post = allNews.find(item => item.slug === slug);
            if (post) {
                history.pushState({slug: slug}, "", "?slug=" + slug);
                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('article-view').classList.remove('hidden');
                
                document.getElementById('detail-title').innerText = post.title;
                
                // FIXED: Use actual database created_at time
                const postDate = new Date(post.created_at);
                const options = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                document.getElementById('detail-date').innerText = postDate.toLocaleDateString('en-IN', options);
                
                document.getElementById('detail-image').src = post.image_url;
                document.getElementById('detail-content').innerHTML = post.content;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function filterCategory(cat) {
            clearInterval(slideInterval);
            document.getElementById('slider-wrapper').innerHTML = ''; // Hide slider on category page
            const filtered = cat === 'All' ? allNews : allNews.filter(item => item.category === cat);
            
            let gridHTML = `<h3 class="text-2xl font-black mb-6 uppercase border-l-4 border-[#cc0000] pl-3">${cat} News</h3><div class="grid grid-cols-1 md:grid-cols-4 gap-4">`;
            filtered.forEach(item => {
                gridHTML += `
                <div onclick="openArticle('${item.slug}')" class="bg-white border shadow-sm cursor-pointer rounded-lg overflow-hidden">
                    <img src="${item.image_url}" class="w-full h-40 object-cover">
                    <div class="p-3"><h4 class="font-bold text-sm">${item.title}</h4></div>
                </div>`;
            });
            gridHTML += '</div>';
            document.getElementById('category-sections').innerHTML = gridHTML;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBackHome() {
            history.pushState({}, "", window.location.pathname);
            renderHome(allNews);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('hidden'); }
        function filterCategoryAndClose(cat) { filterCategory(cat); toggleMobileMenu(); }
        
        loadNews();
    </script>
</body>
</html>
