<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

    <!-- Top Bar -->

        <div class="container mx-auto px-4 flex justify-between items-center text-xs text-gray-600">

            </div>
            <div class="flex items-center gap-3">
                <div class="flex gap-2">
                    <a href="#" class="bg-blue-600 text-white w-6 h-6 flex items-center justify-center rounded-full"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="bg-black text-white w-6 h-6 flex items-center justify-center rounded-full"><i class="fa-brands fa-x-twitter"></i></a>

                </div>
            </div>

    </div>

    <!-- Main Header -->
    <header class="bg-[#cc0000] text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 flex items-center justify-between py-2">
            <!-- Logo -->
            <a href="index.html" class="flex items-center bg-white px-3 py-1 rounded">
                <i class="fa-solid fa-bolt text-yellow-500 text-2xl mr-1"></i>
                <span class="text-2xl font-black text-[#cc0000] tracking-tighter">FASTJOB</span>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex space-x-6 text-sm font-bold">
                <button onclick="filterCategory('All')" class="hover:text-yellow-300 transition uppercase">???</button>
                <button onclick="filterCategory('National')" class="hover:text-yellow-300 transition uppercase">???</button>
                <button onclick="filterCategory('World')" class="hover:text-yellow-300 transition uppercase">??????</button>
                <button onclick="filterCategory('Business')" class="hover:text-yellow-300 transition uppercase">???????</button>
            </nav>
            
            <!-- Search Icon -->
            <div class="bg-white rounded px-2 py-1 flex items-center w-48">
                <input type="text" placeholder="?????? ?????..." class="w-full text-xs text-black outline-none">
                <i class="fa-solid fa-magnifying-glass text-[#cc0000]"></i>
            </div>
        </div>
        
        <!-- Breaking News Ticker -->
        <div class="bg-[#a30000] py-1 border-t border-red-500 text-xs font-bold px-4 flex items-center">
            <span class="bg-white text-red-700 px-2 py-0.5 rounded mr-3 whitespace-nowrap">???????? ??????</span>
            <marquee class="text-white">FastJob News ?? ????? ??? ?? ?????? ?? 10 ???? ???? ?? ????? ?????? ??????? ??...</marquee>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        
        <!-- Article View (Matches IDBI Screenshot) -->
        <div id="article-view" class="hidden bg-white p-4 md:p-8 max-w-4xl mx-auto shadow-sm border-t-4 border-[#cc0000]">
            <h1 id="detail-title" class="text-3xl md:text-[40px] font-black text-gray-900 leading-tight mb-4"></h1>
            
            <!-- Author & Share Row -->
            <div class="flex flex-col md:flex-row md:items-center justify-between border-b pb-3 mb-6 gap-4">
                <div class="flex items-center gap-3">
                    <img src="https://ui-avatars.com/api/?name=Fast+Job&background=cc0000&color=fff" class="w-10 h-10 rounded-full">
                    <div>
                        <p class="font-bold text-sm text-gray-900">FastJob Desk</p>
                        <p id="detail-date" class="text-xs text-gray-500"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-500 mr-2">Share on:</span>
                    <button class="bg-[#1877f2] text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-brands fa-facebook-f"></i></button>
                    <button class="bg-[#25d366] text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-brands fa-whatsapp"></i></button>
                    <button class="bg-black text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-brands fa-x-twitter"></i></button>
                </div>
            </div>

            <!-- Big Image -->
            <img id="detail-image" src="" class="w-full h-auto object-contain max-h-[500px] mb-6">
            
            <!-- Rich Content -->
            <div id="detail-content"></div>
        </div>

        <!-- Home Grid View -->
        <div id="home-view">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
                <!-- Main Lead -->
                <div id="lead-story" class="lg:col-span-8 bg-white border shadow-sm">
                    <p class="p-10 text-center text-gray-500 font-bold">?????? ??? ?? ??? ???...</p>
                </div>
                <!-- Sidebar List -->
                <div id="sidebar-news" class="lg:col-span-4 bg-white border shadow-sm flex flex-col">
                    <h3 class="bg-[#cc0000] text-white font-bold p-2 text-sm">????? ??????</h3>
                    <div id="sidebar-content" class="flex-grow flex flex-col p-2 space-y-2"></div>
                </div>
            </div>

            <!-- Grid Section -->
            <div class="mt-6">
                <h3 class="text-xl font-black text-gray-900 mb-4 border-l-4 border-[#cc0000] pl-2">?? ?????? ?????</h3>
                <div id="grid-news" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://wioheljpjdcprozqumpv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_d_ROr-nG6RpIRlVWtIE-Fg_sciaLZXR";
        let allNews = [];

        async function loadNews() {
            try {
                const response = await fetch(SUPABASE_URL + "/rest/v1/posts?select=*&order=id.desc&limit=10", {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
                });
                if (!response.ok) return;
                const data = await response.json();
                if (!data || data.length === 0) return;

                allNews = data;
                renderNews(allNews);

                const urlParams = new URLSearchParams(window.location.search);
                const postSlug = urlParams.get('slug');
                if (postSlug) {
                    const found = allNews.find(item => item.slug === postSlug);
                    if (found) showArticleDetail(found);
                }
            } catch (err) { console.error(err); }
        }

        function renderNews(newsList) {
            if (newsList.length === 0) return;

            const lead = newsList[0];
            document.getElementById('lead-story').innerHTML = `
                <div onclick="openArticle('${lead.slug}')" class="cursor-pointer relative">
                    <img src="${lead.image_url}" class="w-full h-[400px] object-cover">
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4 pt-16">
                        <span class="bg-[#cc0000] text-white text-xs px-2 py-0.5 rounded font-bold">${lead.category}</span>
                        <h2 class="text-white text-3xl font-black mt-2 leading-tight drop-shadow-md">${lead.title}</h2>
                    </div>
                </div>
            `;

            const sidebarContent = document.getElementById('sidebar-content');
            sidebarContent.innerHTML = '';
            for (let i = 1; i < Math.min(newsList.length, 5); i++) {
                const item = newsList[i];
                sidebarContent.innerHTML += `
                    <div onclick="openArticle('${item.slug}')" class="flex gap-3 items-center border-b pb-2 cursor-pointer hover:bg-gray-50 transition p-1">
                        <img src="${item.image_url}" class="w-24 h-16 object-cover flex-shrink-0">
                        <h4 class="font-bold text-sm text-gray-900 line-clamp-3 leading-snug">${item.title}</h4>
                    </div>
                `;
            }

            const gridContainer = document.getElementById('grid-news');
            gridContainer.innerHTML = '';
            for (let i = 5; i < newsList.length; i++) {
                const item = newsList[i];
                gridContainer.innerHTML += `
                    <div onclick="openArticle('${item.slug}')" class="bg-white border shadow-sm cursor-pointer hover:shadow-md transition">
                        <img src="${item.image_url}" class="w-full h-40 object-cover">
                        <div class="p-3">
                            <h4 class="font-bold text-base text-gray-900 line-clamp-2 leading-snug">${item.title}</h4>
                        </div>
                    </div>
                `;
            }
        }

        function openArticle(slug) {
            const post = allNews.find(item => item.slug === slug);
            if (post) {
                history.pushState({slug: slug}, "", "?slug=" + slug);
                showArticleDetail(post);
            }
        }

        function showArticleDetail(post) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('article-view').classList.remove('hidden');

            document.getElementById('page-title').innerText = post.title;
            document.getElementById('detail-title').innerText = post.title;
            
            // Set dynamic date like screenshot
            const today = new Date();
            const options = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('detail-date').innerText = today.toLocaleDateString('hi-IN', options);
            
            document.getElementById('detail-image').src = post.image_url;
            document.getElementById('detail-content').innerHTML = post.content;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterCategory(cat) {
            history.pushState({}, "", window.location.pathname);
            document.getElementById('article-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            
            if (cat === 'All') renderNews(allNews);
            else {
                const filtered = allNews.filter(item => item.category === cat);
                renderNews(filtered);
            }
        }
        loadNews();
    </script>
</body>
</html>
