<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastJob News - 24/7 Live News Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <header class="bg-red-700 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-2 flex justify-between items-center text-xs border-b border-red-600">
            <div class="flex items-center space-x-4">
                <span><i class="fa-solid fa-calendar-days"></i> <span id="current-date"></span></span>
                <span><i class="fa-solid fa-location-dot text-yellow-300"></i> Jaipur, India</span>
            </div>
            <div class="font-bold tracking-wider">fastjob.online</div>
        </div>

        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" class="text-3xl font-black tracking-tight flex items-center gap-2">
                <i class="fa-solid fa-bolt text-yellow-300"></i> FASTJOB <span class="bg-white text-red-700 px-2 py-0.5 rounded text-xl">NEWS</span>
            </a>
        </div>

        <nav class="bg-red-800 text-white shadow-inner">
            <div class="container mx-auto px-4 flex space-x-6 overflow-x-auto py-2.5 text-sm font-bold whitespace-nowrap">
                <button onclick="filterCategory('All')" class="hover:text-yellow-300 transition cursor-pointer">Home</button>
                <button onclick="filterCategory('National')" class="hover:text-yellow-300 transition cursor-pointer">National</button>
                <button onclick="filterCategory('Technology')" class="hover:text-yellow-300 transition cursor-pointer">Technology</button>
                <button onclick="filterCategory('Business')" class="hover:text-yellow-300 transition cursor-pointer">Business</button>
                <button onclick="filterCategory('Entertainment')" class="hover:text-yellow-300 transition cursor-pointer">Entertainment</button>
                <button onclick="filterCategory('Sports')" class="hover:text-yellow-300 transition cursor-pointer">Sports</button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-6">
        <div id="main-layout" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div id="lead-story" class="lg:col-span-2 bg-white rounded-xl shadow-md p-6 border text-center text-gray-700 font-bold">
                Loading live news...
            </div>
            <div id="sidebar-news" class="space-y-4">
                <div class="bg-white rounded-xl shadow-md p-4 text-center text-gray-500">Loading stories...</div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        const SUPABASE_URL = "https://wioheljpjdcprozqumpv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_d_ROr-nG6RpIRlVWtIE-Fg_sciaLZXR";
        
        let allNews = [];

        async function loadNews() {
            const leadContainer = document.getElementById('lead-story');
            
            try {
                const response = await fetch(${SUPABASE_URL}/rest/v1/posts?select=*&order=id.desc&limit=30, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": Bearer 
                    }
                });

                if (!response.ok) {
                    leadContainer.innerHTML = <p class="text-red-600 font-bold">Error loading news</p>;
                    return;
                }

                const data = await response.json();

                if (!data || data.length === 0) {
                    leadContainer.innerHTML = <p class="text-orange-600 font-bold">Database is empty!</p>;
                    return;
                }

                allNews = data;
                renderNews(allNews);

            } catch (err) {
                leadContainer.innerHTML = <p class="text-red-600 font-bold">Connection Failed</p>;
            }
        }

        function renderNews(newsList) {
            const leadContainer = document.getElementById('lead-story');
            const sidebarContainer = document.getElementById('sidebar-news');

            const lead = newsList[0];
            leadContainer.innerHTML = 
                <div class="relative overflow-hidden rounded-lg mb-4">
                    <img src="" class="w-full h-80 object-cover">
                    <span class="absolute top-4 left-4 bg-red-700 text-white text-xs px-3 py-1 rounded font-bold uppercase"></span>
                </div>
                <h2 class="font-black text-2xl text-gray-900 mb-2 text-left"></h2>
                <p class="text-gray-600 text-sm text-left mb-4"></p>
                <div class="text-left text-xs text-gray-500 border-t pt-3 flex justify-between">
                    <span>Source: Live RSS Feed</span>
                    <span class="text-red-700 font-bold">Read More &rarr;</span>
                </div>
            ;

            sidebarContainer.innerHTML = '';
            for (let i = 1; i < Math.min(newsList.length, 6); i++) {
                const item = newsList[i];
                sidebarContainer.innerHTML += 
                    <div class="bg-white rounded-xl shadow-sm p-3 border flex gap-3 items-center text-left hover:shadow-md transition cursor-pointer">
                        <img src="" class="w-20 h-16 object-cover rounded flex-shrink-0">
                        <div>
                            <span class="text-[10px] font-bold text-red-700 uppercase"></span>
                            <h4 class="font-bold text-xs text-gray-900 line-clamp-2"></h4>
                        </div>
                    </div>
                ;
            }
        }

        function filterCategory(cat) {
            if (cat === 'All') {
                renderNews(allNews);
            } else {
                const filtered = allNews.filter(item => item.category && item.category.toLowerCase() === cat.toLowerCase());
                if(filtered.length > 0) {
                    renderNews(filtered);
                } else {
                    document.getElementById('lead-story').innerHTML = <p class="p-6 text-center text-gray-500">No news found in  category.</p>;
                    document.getElementById('sidebar-news').innerHTML = '';
                }
            }
        }

        loadNews();
    </script>
</body>
</html>
